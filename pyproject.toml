[project]
name = "antigravity-account-pool"
version = "0.1.0"
description = "Round-robin of Antigravity CLI accounts with quota failover and a bridge to Claude Code config"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-include = ["agy-pool"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess", "execv"]
include = ["*/agy-pool"]

[tool.coverage.report]
fail_under = 100
show_missing = true
