---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Test
        run: uv run coverage run -m pytest -v --junitxml=test-results.xml

      - name: Combine coverage data
        if: always()
        run: uv run coverage combine -q

      - name: Coverage report (enforces fail_under)
        run: uv run coverage report

      - name: Coverage JSON
        if: always()
        run: uv run coverage json --fail-under=0 -o coverage.json

      - name: Build badges
        id: badges
        if: always()
        run: uv run python .github/scripts/make_badges.py

      - name: Lint
        if: always()
        run: uv run ruff check

      - name: Upload badges
        if: >-
          always() && steps.badges.outcome == 'success'
          && github.event_name == 'push'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: badges
          path: badges
          retention-days: 1

  # Badges live on an orphan "badges" branch so CI never pushes to main.
  # Only this job can write to the repository.
  publish-badges:
    needs: test
    if: >-
      always() && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: badges
          path: badges

      - name: Publish badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          cd badges
          git init -q
          git checkout -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: update badges"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push -f "https://github.com/${REPO}.git" badges
